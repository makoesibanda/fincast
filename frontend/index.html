<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FinCast — BTC Forecasting</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060810;--surface:#0d1117;--surface2:#131920;
  --border:#1e2630;--border2:#252f3a;
  --accent:#00d4aa;--accent2:#0ea5e9;--danger:#f43f5e;
  --text:#e8edf2;--muted:#6b7a8d;
  --radius:10px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);
     min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}

/* animated background grid */
body::before{
  content:'';position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(0,212,170,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,212,170,.03) 1px,transparent 1px);
  background-size:40px 40px;
  pointer-events:none;z-index:0;
}

nav{display:flex;align-items:center;justify-content:space-between;
    padding:0 2.5rem;height:60px;
    border-bottom:1px solid var(--border);background:rgba(6,8,16,.8);
    backdrop-filter:blur(12px);position:sticky;top:0;z-index:100}
.logo{font-family:'Space Mono',monospace;font-size:1rem;
      color:var(--accent);letter-spacing:.05em}
.logo span{color:var(--text);opacity:.5}

.hero{flex:1;display:flex;align-items:center;justify-content:center;
      padding:4rem 1.5rem;position:relative;z-index:1}
.hero-inner{display:flex;flex-direction:column;align-items:center;
            gap:2.5rem;max-width:900px;width:100%;text-align:center}

.headline{font-size:clamp(2rem,6vw,3.8rem);font-weight:600;line-height:1.1;
          letter-spacing:-.02em}
.headline em{font-style:normal;color:var(--accent)}
.sub{color:var(--muted);font-size:1.05rem;max-width:480px;line-height:1.7}

.badges{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center}
.badge{padding:.3rem .9rem;border-radius:20px;font-size:.78rem;
       font-family:'Space Mono',monospace;
       background:rgba(0,212,170,.07);border:1px solid rgba(0,212,170,.2);
       color:var(--accent)}

/* card */
.card{background:var(--surface);border:1px solid var(--border);
      border-radius:var(--radius);padding:2rem;width:100%;max-width:420px}
.tabs{display:flex;gap:.5rem;margin-bottom:1.75rem}
.tab{flex:1;padding:.5rem;border:1px solid var(--border2);
     border-radius:var(--radius);background:none;color:var(--muted);
     cursor:pointer;font-size:.9rem;font-family:'DM Sans',sans-serif;
     transition:all .15s}
.tab.active{background:var(--accent);color:#000;border-color:var(--accent);
            font-weight:600}
.fg{margin-bottom:1rem}
label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:.4rem;
      text-transform:uppercase;letter-spacing:.05em}
input{width:100%;padding:.65rem .9rem;background:var(--bg);
      border:1px solid var(--border2);border-radius:var(--radius);
      color:var(--text);font-size:.9rem;outline:none;
      font-family:'DM Sans',sans-serif;transition:border-color .15s}
input:focus{border-color:var(--accent)}
.btn{width:100%;padding:.75rem;background:var(--accent);color:#000;
     border:none;border-radius:var(--radius);font-size:.95rem;
     font-weight:600;cursor:pointer;transition:opacity .15s;
     font-family:'DM Sans',sans-serif;margin-top:.5rem}
.btn:hover{opacity:.85}
.btn:disabled{opacity:.4;cursor:not-allowed}
.msg{font-size:.83rem;margin-top:.7rem;text-align:center;min-height:1.2em}
.err{color:var(--danger)}.ok{color:var(--accent)}
</style>
</head>
<body>
<nav>
  <span class="logo">Fin<span>Cast</span></span>
</nav>
<section class="hero">
  <div class="hero-inner">
    <div>
      <h1 class="headline">Intelligent<br/><em>BTC Forecasting</em></h1>
      <p class="sub" style="margin:.9rem auto 1.5rem">
        GRU-powered daily return prediction with FinBERT sentiment integration.
        Built for the Goldsmiths BSc Computer Science final year project.
      </p>
      <div class="badges">
        <span class="badge">GRU Sharpe 2.612</span>
        <span class="badge">DirAcc 54.19%</span>
        <span class="badge">MaxDD −18.1%</span>
        <span class="badge">19 features</span>
        <span class="badge">FinBERT NLP</span>
        <span class="badge">HFM Ensemble</span>
      </div>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="tab active" id="tl" onclick="sw('login')">Sign In</button>
        <button class="tab"        id="tr" onclick="sw('reg')">Register</button>
      </div>

      <form id="fl" onsubmit="doLogin(event)">
        <div class="fg"><label>Username</label>
          <input id="lu" type="text" placeholder="your_username" required autocomplete="username"/></div>
        <div class="fg"><label>Password</label>
          <input id="lp" type="password" placeholder="••••••••" required autocomplete="current-password"/></div>
        <button class="btn" type="submit" id="lbtn">Sign In</button>
        <p class="msg" id="lm"></p>
      </form>

      <form id="fr" style="display:none" onsubmit="doReg(event)">
        <div class="fg"><label>Username</label>
          <input id="ru" type="text" placeholder="your_username" required autocomplete="username"/></div>
        <div class="fg"><label>Email</label>
          <input id="re" type="email" placeholder="you@example.com" required autocomplete="email"/></div>
        <div class="fg"><label>Password</label>
          <input id="rp" type="password" placeholder="min 8 characters" required autocomplete="new-password"/></div>
        <button class="btn" type="submit" id="rbtn">Create Account</button>
        <p class="msg" id="rm"></p>
      </form>
    </div>
  </div>
</section>

<script>
const API = '/api';
if(localStorage.getItem('fc_token')) location.href='dashboard.html';

function sw(t){
  document.getElementById('fl').style.display = t==='login'?'':'none';
  document.getElementById('fr').style.display = t==='reg'?'':'none';
  document.getElementById('tl').classList.toggle('active',t==='login');
  document.getElementById('tr').classList.toggle('active',t==='reg');
}

async function doLogin(e){
  e.preventDefault();
  const msg=document.getElementById('lm'), btn=document.getElementById('lbtn');
  msg.textContent='Signing in…';msg.className='msg';btn.disabled=true;
  try{
    const r=await fetch(`${API}/auth/login`,{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:document.getElementById('lu').value.trim(),
                           password:document.getElementById('lp').value})});
    const d=await r.json();
    if(!r.ok){msg.textContent=d.error||'Login failed';msg.className='msg err';return;}
    localStorage.setItem('fc_token',d.token);
    localStorage.setItem('fc_user',JSON.stringify(d.user));
    msg.textContent='Success!';msg.className='msg ok';
    setTimeout(()=>location.href='dashboard.html',500);
  }catch{msg.textContent='Network error';msg.className='msg err';}
  finally{btn.disabled=false;}
}

async function doReg(e){
  e.preventDefault();
  const msg=document.getElementById('rm'),btn=document.getElementById('rbtn');
  msg.textContent='Creating account…';msg.className='msg';btn.disabled=true;
  try{
    const r=await fetch(`${API}/auth/register`,{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:document.getElementById('ru').value.trim(),
                           email:document.getElementById('re').value.trim().toLowerCase(),
                           password:document.getElementById('rp').value})});
    const d=await r.json();
    if(!r.ok){msg.textContent=d.error||'Registration failed';msg.className='msg err';return;}
    msg.textContent='Account created! Sign in now.';msg.className='msg ok';
    setTimeout(()=>sw('login'),1200);
  }catch{msg.textContent='Network error';msg.className='msg err';}
  finally{btn.disabled=false;}
}
</script>
</body>
</html>
