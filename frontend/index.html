<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FinCast - Sign In</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="fincast.css" />

</head>
<body>

  <!-- The FinCast Logo -->
  <nav>
    <span class="logo">Fin<span>Cast</span></span>
  </nav>

  <section class="hero">
    <div class="hero-inner">

      <div>
        <h1 class="headline">Intelligent Engine<br /><em>For Financial Forecasting 
</em></h1>
         
         <!-- Key performance indicators of the deployed forecasting model -->
         <div class="badges">
          <span class="badge">HFM Sharpe 2.209</span>
          <span class="badge">DirAcc 52.40%</span>
          <span class="badge">MaxDD -18.1%</span>
          <span class="badge">19 features</span>
          <span class="badge">FinBERT NLP</span>
          <span class="badge">HFM Ensemble</span>
        </div>
      </div>

      <div class="card">

        <div class="tabs">
          <button class="tab active" id="tab-login" onclick="switchTab('login')">Sign In</button>
          <button class="tab"        id="tab-reg"   onclick="switchTab('reg')">Register</button>
        </div>

        <!-- Login form -->
        <form id="form-login" onsubmit="doLogin(event)">
          <div class="fg">
            <label>Username</label>
            <input id="login-username" type="text" placeholder="your username" required autocomplete="username" />
          </div>
          <div class="fg">
            <label>Password</label>
            <input id="login-password" type="password" placeholder="..........." required autocomplete="current-password" />
          </div>
          <button class="btn" type="submit" id="btn-login">Sign In</button>
          <p class="msg" id="msg-login"></p>
        </form>

        <!-- Account creation form (toggled via tab selection) -->
        <form id="form-reg" style="display: none;" onsubmit="doRegister(event)">
          <div class="fg">
            <label>Username</label>
            <input id="reg-username" type="text" placeholder="your_username" required autocomplete="username" />
          </div>
          <div class="fg">
            <label>Email</label>
            <input id="reg-email" type="email" placeholder="you@example.com" required autocomplete="email" />
          </div>
          <div class="fg">
            <label>Password</label>
            <input id="reg-password" type="password" placeholder="min 8 characters" required autocomplete="new-password" />
          </div>
          <button class="btn" type="submit" id="btn-reg">Create Account</button>
          <p class="msg" id="msg-reg"></p>
        </form>

      </div>
    </div>
  </section>

  <script>
    const API = '/api';

    // Skip the login page if a session already exists
    if (localStorage.getItem('fc_token')) {
      location.href = 'market.html';
    }

    function switchTab(tab) {
      // Handle tab switching between authentication and registration views
      const isLogin = tab === 'login';
      document.getElementById('form-login').style.display = isLogin ? '' : 'none';
      document.getElementById('form-reg').style.display   = isLogin ? 'none' : '';
      document.getElementById('tab-login').classList.toggle('active', isLogin);
      document.getElementById('tab-reg').classList.toggle('active', !isLogin);
    }

    async function doLogin(e) {
      e.preventDefault();

      const msg = document.getElementById('msg-login');
      const btn = document.getElementById('btn-login');

      msg.textContent = 'Signing in…';
      msg.className   = 'msg';
      btn.disabled    = true;

      try {
        const response = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('login-username').value.trim(),
            password: document.getElementById('login-password').value
          })
        });

        const data = await response.json();

        if (!response.ok) {
          msg.textContent = data.error || 'Login failed';
          msg.className   = 'msg err';
          return;
        }

        // Store token and user info so other pages can access them
        localStorage.setItem('fc_token', data.token);
        localStorage.setItem('fc_user',  JSON.stringify(data.user));

        msg.textContent = 'Success!';
        msg.className   = 'msg ok';

        setTimeout(() => location.href = 'market.html', 500);

      } catch {
        msg.textContent = 'Network error. Please try again or Refresh the page.';
        msg.className   = 'msg err';
      } finally {
        btn.disabled = false;
      }
    }

    async function doRegister(e) {
      e.preventDefault();

      const msg = document.getElementById('msg-reg');
      const btn = document.getElementById('btn-reg');

      msg.textContent = 'Creating account…';
      msg.className   = 'msg';
      btn.disabled    = true;

      try {
        const response = await fetch(`${API}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('reg-username').value.trim(),
            email:    document.getElementById('reg-email').value.trim().toLowerCase(),
            password: document.getElementById('reg-password').value
          })
        });

        const data = await response.json();

        if (!response.ok) {
          msg.textContent = data.error || 'Registration failed';
          msg.className   = 'msg err';
          return;
        }

        msg.textContent = 'Account created! You can now sign in.';
        msg.className   = 'msg ok';

        // Switch back to login tab after a short delay
        setTimeout(() => switchTab('login'), 1200);

      } catch {
        msg.textContent = 'Network error. Please try again.';
        msg.className   = 'msg err';
      } finally {
        btn.disabled = false;
      }
    }
  </script>

  
<!-- Server status notice - dismissible by the user -->
<div id="wake-notice" style="
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: rgba(245, 158, 11, .12);
  border-top: 1px solid rgba(245, 158, 11, .35);
  padding: .55rem 2rem;
  font-size: .8rem;
  color: var(--warn);
  text-align: center;
  z-index: 999;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1rem;">
  ⚠️ If the app is slow or shows an error on first load, the server may be waking up - wait a few seconds, refresh the page and try again.
  <span onclick="this.parentElement.style.display='none'"
    style="cursor: pointer; opacity: .6; font-size: 1rem; flex-shrink: 0;">✕</span>
</div>
  
  <style>
    /* Slightly larger grid on the login page for more visual impact */
    body::before {
      background-size: 40px 40px;
    }

    /* Full height centred layout for the hero section */
    .hero {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4rem 1.5rem;
      position: relative;
      z-index: 1;
    }

    .hero-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.5rem;
      max-width: 900px;
      width: 100%;
      text-align: center;
    }

    .headline {
      font-size: clamp(2rem, 6vw, 3.8rem);
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -.02em;
    }

    .headline em {
      font-style: normal;
      color: var(--accent);
    }

    .sub {
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 480px;
      line-height: 1.7;
      margin: .9rem auto 1.5rem;
    }

    /* Quick stat badges shown under the headline */
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: .6rem;
      justify-content: center;
    }

    .badge {
      padding: .3rem .9rem;
      border-radius: 20px;
      font-size: .78rem;
      font-family: 'Space Mono', monospace;
      background: rgba(0, 212, 170, .07);
      border: 1px solid rgba(0, 212, 170, .2);
      color: var(--accent);
    }

    /* Auth card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      width: 100%;
      max-width: 420px;
    }

    /* Sign In / Register tab switcher */
    .tabs {
      display: flex;
      gap: .5rem;
      margin-bottom: 1.75rem;
    }

    .tab {
      flex: 1;
      padding: .5rem;
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      background: none;
      color: var(--muted);
      cursor: pointer;
      font-size: .9rem;
      font-family: 'DM Sans', sans-serif;
      transition: all .15s;
    }

    .tab.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 600;
    }

    .fg {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: .8rem;
      color: var(--muted);
      margin-bottom: .4rem;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    input {
      width: 100%;
      padding: .65rem .9rem;
      background: var(--bg);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      color: var(--text);
      font-size: .9rem;
      outline: none;
      font-family: 'DM Sans', sans-serif;
      transition: border-color .15s;
    }

    input:focus {
      border-color: var(--accent);
    }

    .btn {
      width: 100%;
      padding: .75rem;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: var(--radius);
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
      font-family: 'DM Sans', sans-serif;
      margin-top: .5rem;
    }

    .btn:hover    { opacity: .85; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }

    /* Status message area below the submit button */
    .msg {
      font-size: .83rem;
      margin-top: .7rem;
      text-align: center;
      min-height: 1.2em;
    }

    .err { color: var(--danger); }
    .ok  { color: var(--accent); }
  </style>

</body>
</html>
